- type: entity
  id: PartScurret
  parent: [BaseItem, BasePart]
  name: "scurret body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: Biological
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 100
  - type: Tag
    tags:
      - Trash
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 1
      - ReagentId: Blood
        Quantity: 5

- type: entity
  id: TorsoScurret
  name: "scurret torso"
  parent: [PartScurret, BaseTorso]
  components:
    - type: Sprite
      sprite: _Inferus/Mobs/Species/Scurret/parts.rsi
      state: "torso"
    - type: Icon
      sprite: _Inferus/Mobs/Species/Scurret/parts.rsi
      state: "torso"
    - type: BodyPart
      partType: Torso
    - type: Extractable
      juiceSolution:
        reagents:
        - ReagentId: Fat
          Quantity: 1
        - ReagentId: Blood
          Quantity: 5

- type: entity
  id: HeadScurret
  name: "scurret head"
