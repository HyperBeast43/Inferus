    - type: Icon
      sprite: _Inferus/Mobs/Species/Scurret/parts.rsi
      state: "head"
    - type: BodyPart
      partType: Head
      vital: true
    - type: Input
      context: "ghost"
    - type: Tag
      tags:
        - Head
    - type: Extractable
