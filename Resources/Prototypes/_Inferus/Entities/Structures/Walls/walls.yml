- type: entity
  parent: WallDiagonalBase
  id: WallWoodDiagonal
  name: wooden wall
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _Inferus/Structures/Walls/wood_diagonal.rsi
    state: state0
  - type: Icon
    sprite: _Inferus/Structures/Walls/wood_diagonal.rsi
    state: state0
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: WoodDestroyHeavy
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:ChangeConstructionNodeBehavior
        node: Barricade
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: woods
    base: wood

## Normal
- type: entity
  parent: [MarkerBase, WallWood]
  id: WallWoodHoneypot
  description: &honeypotDesc Notifies admins when it gets damaged. Can be destroyed as normal.
  suffix: &honeypotSuffix Honeypot
  components:
    - type: TimedDespawn
      lifetime: 2.1
    - type: SpawnOnDespawn
      prototype: MobQuartzCrab
    - type: ReplaceOnInit
      proto: WallWood
      overrides: &honeypotOverrides
        - type: AdminNotifyOnDamage
          subject: "honeypot"
    - &solidWallSprite
      type: Sprite
      sprite: Structures/Walls/wood.rsi
      layers:
        - sprite: _Starlight/Markers/cross.rsi
          state: orange
          scale: &scale 1.25,1.25
        - state: full

## Indestructible
- type: entity
  parent: [MarkerBase, WallWood]
  id: WallWoodHoneypotIndestructible
  description: &honeypotDescIndestructible Notifies admins when it gets damaged and is secretly indestructible.
  suffix: &honeypotSuffixIndestructible Honeypot, Indestructible
  components:
    - type: ReplaceOnInit
      proto: WallWood
      overrides: &honeypotOverridesIndestructible
        - type: AdminNotifyOnDamage
          subject: "honeypot"
        - type: Destructible
          thresholds: []
    - *solidWallSprite

## Normal
- type: entity
  parent: [MarkerBase, WallBrick]
  id: WallBrickHoneypot
  description: *honeypotDesc
  suffix: *honeypotSuffix
  components:
    - type: ReplaceOnInit
      proto: WallBrick
      overrides: *honeypotOverrides
    - &reinforcedWallSprite
      type: Sprite
      sprite: Structures/Walls/brick.rsi
      layers:
        - sprite: _Starlight/Markers/cross.rsi
          state: orange
          scale: *scale
        - state: rgeneric

## Indestructible
- type: entity
  parent: [MarkerBase, WallBrick]
  id: WallBrickHoneypotIndestructible
  description: *honeypotDescIndestructible
  suffix: *honeypotSuffixIndestructible
  components:
    - type: ReplaceOnInit
      proto: WallBrick
      overrides: *honeypotOverridesIndestructible
    - *reinforcedWallSprite

# Honeypots END
