- type: entity
  parent: BaseWallmountMetallic
  id: BaseDispenser
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/walldispenser.rsi
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
    - trigger:
        !type:DamageTypeTrigger
        damageType: Piercing
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: DrainableSolution
    solution: tank
  - type: ReagentTank
  - type: ExaminableSolution
    solution: tank
# Inferus start
  - type: CollideOnAnchor
  - type: Visibility
    layer: 1
# Inferus end

- type: entity
  parent: BaseDispenser
  id: CleanerDispenser
  categories: [ ShouldMapStation ] # Starlight
  name: space cleaner dispenser
  description: Wall-mounted reagent dispenser. Connects to the plumbing network; usually contains space cleaner, hence the name.
  components:
  - type: Sprite
    layers:
    - state: cleanerdispenser
      map: [ "enum.SubfloorLayers.FirstLayer" ]
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: fill-
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 5000
        reagents:
        - ReagentId: SpaceCleaner
          Quantity: 5000
  # Inferus start
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: tank
    inletNames:
    - inletN
    - inletE
    - inletW
    - inletS
  - type: NodeContainer
    nodes:
      inletN:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      inletE:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      inletW:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
      inletS:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
  - type: ExaminableSolution
    solution: tank
  - type: SubFloorHide
    blockInteractions: false
    blockAmbience: false
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
    - enum.SolutionContainerLayers.Fill
  - type: PlumbingConnectorAppearance
    offset: 0.09375
  # Inferus End

- type: entity
  parent: BaseDispenser
  id: FuelDispenser
  name: fuel dispenser
  description: Wall-mounted reagent dispenser. Connects to the plumbing network; usually contains welding fuel, hence the name.
  components:
  - type: Sprite
    layers:
    - state: fueldispenser
      map: [ "enum.SubfloorLayers.FirstLayer" ]
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: fill-
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1000
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 1000
  - type: ReagentTank
    tankType: Fuel
  - type: DamageOnToolInteract
    tools: Welding
    weldingDamage:
      types:
        Heat: 20
  - type: PacifismDangerousAttack
  - type: Explosive
    explosionType: Default
    totalIntensity: 50
  # Inferus start
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: tank
    inletNames:
    - inletN
    - inletE
    - inletW
    - inletS
  - type: NodeContainer
    nodes:
      inletN:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      inletE:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      inletW:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
      inletS:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
  - type: ExaminableSolution
    solution: tank
  - type: SubFloorHide
    blockInteractions: false
    blockAmbience: false
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
    - enum.SolutionContainerLayers.Fill
  - type: PlumbingConnectorAppearance
    offset: 0.09375
  # Inferus End
